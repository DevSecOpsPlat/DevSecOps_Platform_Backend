# EnviroTest — reverse proxy Nginx, VARIANTE DOCKER (conteneur sur le réseau docker-compose)
# Identique à envirotest.conf, sauf :
#   - upstreams par nom de service Docker (backend, frontend) au lieu de 127.0.0.1
#   - logs vers stdout/stderr (convention Docker : `docker logs envirotest-nginx`)
#
# Utilisé par le service "nginx" dans docker-compose.yml (DevSecOps_Platform_Frontend).
# Pour un déploiement hors Docker (VM/Windows nu), utiliser envirotest.conf à la place.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format security '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time u="$upstream_addr"';
    access_log /dev/stdout security;
    error_log  /dev/stderr warn;

    client_max_body_size 10m;
    client_body_timeout  12s;
    client_header_timeout 12s;

    limit_req_zone  $binary_remote_addr zone=global_limit:20m rate=100r/m;
    limit_req_zone  $binary_remote_addr zone=login_limit:10m  rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=admin_limit:10m  rate=60r/m;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Motifs SQLi/XSS, une couche avant Spring (chantier sécurité, 4 septembre 2026) ──
    # Reprend les mêmes signatures que ThreatDetectionService.java (SQL_PATTERNS/XSS_PATTERNS) sur
    # $request_uri (chemin + query string) — même périmètre que le filtre applicatif, qui n'inspecte
    # pas non plus le corps de la requête. Ce n'est PAS un WAF au sens strict (pas d'inspection du
    # corps, pas de moteur de règles type ModSecurity/OWASP CRS) : une couche de filtrage légère par
    # motifs, positionnée avant Spring pour écarter le cas le plus grossier sans jamais solliciter
    # la JVM — le filtre applicatif reste la ligne de défense de référence.
    #
    # $request_uri n'est PAS décodé par Nginx (comme getQueryString() côté Servlet, même limite
    # applicative) : les espaces/quotes/chevrons encodés (%20, +, %27, %3C...) sont donc couverts
    # explicitement ci-dessous pour les cas les plus courants (formulaire, navigateur) ; un encodage
    # plus exotique (double encodage, hex sur chaque lettre) resterait non détecté ici, comme côté
    # applicatif.
    map $request_uri $waf_pattern_block {
        default 0;
        "~*(\x27|\"|%27|%22)(?:\s|%20|\+)*or(?:\s|%20|\+)+(\x27|\"|%27|%22)?\d" 1;
        "~*or(?:\s|%20|\+)+1(?:\s|%20|\+)*=(?:\s|%20|\+)*1" 1;
        "~*;(?:\s|%20|\+)*drop(?:\s|%20|\+)+" 1;
        "~*union(?:\s|%20|\+)+select" 1;
        "~*sleep(?:\s|%20|\+)*\(" 1;
        "~*benchmark(?:\s|%20|\+)*\(" 1;
        "~*information_schema" 1;
        "~*(<|%3C)(?:\s|%20|\+)*script" 1;
        "~*javascript(?:\s|%20|\+)*(:|%3A)" 1;
        "~*on(error|load|click|mouse)(?:\s|%20|\+)*=" 1;
        "~*(<|%3C)(?:\s|%20|\+)*iframe" 1;
        "~*document(?:\s|%20|\+)*\.(?:\s|%20|\+)*cookie" 1;
    }

    # ── Upstreams : noms de service docker-compose (résolus par le DNS interne Docker) ──
    upstream spring_backend {
        server backend:8089;
        keepalive 32;
    }

    upstream angular_dev {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 8081;
        server_name localhost envirotest.local;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Activer uniquement avec HTTPS :
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Blocage immédiat (filtrage léger Nginx — avant Spring) ──
        location ~* \.(env|git|sql|bak|old|swp)$ {
            return 403;
        }
        location ~* ^/(wp-admin|wp-login\.php|phpmyadmin|\.env|\.git|admin/secret|actuator) {
            return 403;
        }
        location ~* ^/projet/(wp-admin|\.env|admin/secret|actuator) {
            return 403;
        }

        if ($waf_pattern_block) {
            return 403;
        }

        # ── Swagger / OpenAPI : bloquer en prod bancaire ──
        location ~ ^/projet/(swagger-ui|v3/api-docs) {
            return 403;
        }

        # ── API Spring Boot — login (limite stricte) ──
        location = /projet/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://spring_backend;
            include conf.d/proxy-headers.conf;
        }

        # ── API Spring Boot — admin (limite dédiée) ──
        location /projet/api/admin/ {
            limit_req zone=admin_limit burst=15 nodelay;
            limit_conn conn_limit 30;
            proxy_pass http://spring_backend;
            include conf.d/proxy-headers.conf;
        }

        # ── API Spring Boot — reste (/projet/*) ──
        location /projet/ {
            limit_req zone=global_limit burst=20 nodelay;
            limit_conn conn_limit 50;
            proxy_pass http://spring_backend;
            include conf.d/proxy-headers.conf;
            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ── Frontend Angular (servi par le conteneur frontend, port 80 interne) ──
        location / {
            limit_req zone=global_limit burst=30 nodelay;
            proxy_pass http://angular_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
